<!DOCTYPE html>
<html lang="vi">

<base target="_top">
<meta charset="utf-8">
<style>
:root{--lz:#2a6fb0;--bg:#fdf1f5;--side:#fff;--card:#fff;--tx:#3a1f2b;--mu:#8a6070;--ac:#a8325e;--bd:#f0d5df;--sel:#f7dbe4;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--lz:#7db6ea;--bg:#1d1519;--side:#2a1d23;--card:#2a1d23;--tx:#f5e8ee;--mu:#b99aa8;--ac:#f08ab0;--bd:#463039;--sel:#3d2630;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,"Noto Sans SC","Noto Sans",sans-serif}
.lay{display:grid;grid-template-columns:290px 1fr;min-height:100vh}.lay.cl{grid-template-columns:86px 1fr}
aside{position:relative;background:var(--side);border-right:1px solid var(--bd);padding:16px;display:flex;flex-direction:column;gap:6px}
.tg{position:absolute;top:28px;right:-16px;width:32px;height:32px;border-radius:50%;background:var(--card);border:1px solid var(--bd);color:var(--tx);padding:0;margin:0;font-size:18px;box-shadow:0 1px 4px rgba(0,0,0,.1);z-index:5}
section{padding:22px;min-width:0}
.us{display:flex;gap:12px;align-items:center;background:var(--sel);border:1px solid var(--bd);border-radius:16px;padding:12px;min-height:48px}
.ua{width:48px;height:48px;border-radius:50%;background:#a83b64;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px;flex:none}
.un{font-weight:700;font-size:17px;line-height:1.2;word-break:break-all}.ur{font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin-top:3px}
nav{display:flex;flex-direction:column;gap:2px;flex:1;margin-top:10px}
.hr{border-top:1px solid var(--bd);margin:14px 10px 4px}.gl{font-size:12px;letter-spacing:.14em;color:var(--mu);margin:8px 14px 6px;text-transform:uppercase}
.ni{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:14px;cursor:pointer;color:var(--mu);font-size:17px}
.ni svg{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ni.on{background:var(--sel);color:var(--ac)}
.stw{border-top:1px solid var(--bd);padding-top:16px;margin-top:8px}
.st{background:var(--sel);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:16px;width:100%;margin:0;font-size:17px}
.ic{display:none}.lay.cl .tx{display:none}.lay.cl .ic{display:inline}.lay.cl .ni{justify-content:center;padding:13px 0}.lay.cl .us{justify-content:center;padding:10px 0}
@media(max-width:700px){.lay,.lay.cl{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--bd);padding:10px}.tg,.hr,.gl{display:none}nav{flex-direction:row;overflow-x:auto;margin:0}.ni{white-space:nowrap;padding:10px 12px;font-size:15px}.ni svg{width:18px;height:18px}.stw{border:0;padding:0;margin:0}.st{padding:10px;font-size:15px}.lay.cl .tx{display:block}.lay.cl .ic{display:none}.lay.cl .ni{justify-content:flex-start;padding:10px 12px}.lay.cl .us{justify-content:flex-start;padding:12px}}
.lc{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lk{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:transform .15s}
.lk:hover{transform:translateY(-2px);border-color:var(--ac)}
.ln{font-size:12px;color:var(--mu);margin-bottom:10px}.lz{font-size:19px;font-weight:700;color:var(--lz);line-height:1.3}.lv{font-size:13px;color:var(--mu);margin-top:6px}
h1{font-size:22px;margin:0 0 10px}h2{font-size:18px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:12px 0}
.mu{color:var(--mu);font-size:14px}.big{font-size:30px;font-weight:700;color:var(--ac)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
input,textarea,button{font:inherit;color:inherit}
input,textarea{width:100%;box-sizing:border-box;padding:9px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
button{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;margin-right:6px}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
.ok{color:#2e7d32}.no{color:#c62828}
.lg{max-width:340px;margin:8vh auto;background:var(--card);border-radius:22px;padding:22px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.15)}
.lg label{display:block;text-align:left;font-size:13px;color:var(--mu)}
.av{width:64px;height:64px;border-radius:50%;margin:0 auto 8px;background:#e8f1fb;border:3px solid #4a90e2;color:#4a90e2;font-size:30px;display:flex;align-items:center;justify-content:center}
.bt{width:100%;background:#2196f3;border-radius:999px;padding:12px;margin:6px 0 0;font-weight:700}
.ex{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:10px;overflow-x:auto;margin:10px 0}
.et{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer}
.et.on{background:var(--sel);border-color:var(--ac)}
.et b{display:block;color:var(--ac);font-size:13px}.et span{font-size:15px;font-weight:600}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px 14px;font-size:22px;margin:8px 0 14px}.pg i{font-style:normal}
.rc{border-top:1px solid var(--bd);padding-top:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}.rc audio{height:36px;max-width:100%}
button.rec{background:#c62828}
</style>
</head>

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function norm(s){return String(s||'').trim().toLowerCase().replace(/\s+/g,' ')}
function sget(k){try{return localStorage.getItem(k)}catch(e){return null}}
function sset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function fd(t){return t?new Date(t).toLocaleString('vi-VN'):''}
function A(id){return assigns.filter(function(x){return x.id===id})[0]}
function W(id){return work.filter(function(x){return x.aid===id})[0]}
function errMsg(e){return e&&e.message==='NOGOOGLE'?'Bạn đang mở file index.html trực tiếp nên không lưu được dữ liệu. Hãy mở bằng đường link Web app của Apps Script (dạng script.google.com/macros/s/.../exec).':'Không kết nối được. Chi tiết lỗi: '+(e&&e.message?e.message:String(e))}
function call(a,p){return new Promise(function(ok,no){if(typeof google==='undefined'||!google.script){no({message:'NOGOOGLE'});return}google.script.run.withSuccessHandler(function(r){ok(JSON.parse(r))}).withFailureHandler(no).api(a,JSON.stringify(p||{}))})}
function $(i){return document.getElementById(i)}

function shell(av,nm,sub,items,body){
  var n='';

}
function stopRec(){if(mr&&mr.state!=='inactive')mr.stop()}
function tick(){var e=$('rt'),sec=Math.round((Date.now()-t0)/1000);if(e)e.textContent=Math.floor(sec/60)+':'+('0'+sec%60).slice(-2);if(sec>=120)stopRec()}
async function recStart(ln,ex){
  var s;try{s=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){note='Không mở được micro. Hãy cho phép trình duyệt dùng micro rồi thử lại.';render();return}
  var chunks=[],mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].filter(function(t){return window.MediaRecorder&&MediaRecorder.isTypeSupported(t)})[0]||'',key=ln+'-'+ex;
  mr=new MediaRecorder(s,mt?{mimeType:mt}:{});
  mr.ondataavailable=function(e){if(e.data.size)chunks.push(e.data)};
  mr.onstop=function(){s.getTracks().forEach(function(t){t.stop()});clearInterval(tm);
    var type=(mr&&mr.mimeType)||mt||'audio/webm',bl=new Blob(chunks,{type:type}),dur=Math.round((Date.now()-t0)/1000);
    recs[key]={url:URL.createObjectURL(bl),bl:bl,type:type,dur:dur,ln:ln,ex:ex,st:'Đang gửi cho giáo viên…'};mr=null;recOn='';note='';render();upload(key)};
  mr.start();t0=Date.now();recOn=key;note='';render();tm=setInterval(tick,500);
}
function upload(key){var r=recs[key],fr=new FileReader();

function tLogin(){
  app.innerHTML='<div class="lg"><div class="av">师</div><h3 style="margin:4px 0 10px">Giáo viên đăng nhập</h3><label>Mật khẩu</label><input id="pw" type="password"><button class="bt" id="go">Đăng nhập</button><p class="no">'+esc(note)+'</p></div>';

async function loginT(p){

    pw=p;note='';assigns=r.as;subs=r.subs;await loadAud();render();if(!iv)iv=setInterval(refT,20000)}

}
async function loadAud(){try{var r=await call('audios',{pw:pw});if(r.list)audios=r.list}catch(e){}}
async function refT(){

  try{var r=await call('tdata',{pw:pw});if(r.as){assigns=r.as;subs=r.subs;await loadAud();if(!Array.prototype.some.call(document.querySelectorAll('audio'),function(a){return !a.paused}))render()}}catch(e){}

  if(tab==='lop-hoc'){var cl={};sl.forEach(function(s){var k=s.cls||'?';cl[k]=cl[k]||{n:0,l:0};cl[k].n++;cl[k].l+=s.n});
    b='<h1>Lớp học</h1><div class="card w"><table><tr><th>Lớp</th><th>Học sinh</th><th>Lượt nộp</th></tr>';Object.keys(cl).sort().forEach(function(k){b+='<tr><td>'+esc(k)+'</td><td>'+cl[k].n+'</td><td>'+cl[k].l+'</td></tr>'});b+='</table></div>'}
  if(tab==='hoc-sinh'){b='<h1>Học sinh</h1><div class="card w"><table><tr><th>Họ và tên</th><th>Lớp</th><th>Đã nộp</th></tr>';sl.sort(function(x,y){return(x.cls+x.name).localeCompare(y.cls+y.name)}).forEach(function(s){b+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.cls)+'</td><td>'+s.n+'/'+assigns.length+'</td></tr>'});b+='</table></div>'}
  if(tab==='nhat-ky'){b='<h1>Nhật ký học tập</h1><div class="card w"><table><tr><th>Thời gian</th><th>Học sinh</th><th>Lớp</th><th>Bài</th><th>Điểm</th><th></th></tr>';E.forEach(function(e,i){b+='<tr><td>'+fd(e.s.at)+'</td><td>'+esc(e.s.name)+'</td><td>'+esc(e.s.cls)+'</td><td>'+esc(e.a.title)+'</td><td>'+(e.s.score==null?'—':esc(e.s.score))+'</td><td><button class="g" data-v="'+i+'">Xem</button></td></tr>'});b+='</table></div>'+(E.length?'':'<p class="mu">Chưa có bài nộp.</p>')+'<div class="card" id="vw" hidden></div>'}
  if(tab==='ghi-am'){b='<h1>Bản ghi âm</h1><div class="card w"><table><tr><th>Thời gian</th><th>Học sinh</th><th>Lớp</th><th>Bài tập</th><th>Nghe</th></tr>';
    audios.forEach(function(a){var p=PRAC[a.lesson],t=p&&p[a.ex]?p[a.ex].t:'';
      b+='<tr><td>'+fd(a.at)+'</td><td>'+esc(a.name)+'</td><td>'+esc(a.cls)+'</td><td>Bài '+esc(a.lesson)+' · BT'+(+a.ex+1)+' '+esc(t)+'</td><td>'+(aud[a.id]?'<audio controls autoplay src="'+aud[a.id]+'"></audio>':'<button class="g" data-a="'+esc(a.id)+'">▶ Nghe</button>')+' <span class="mu">'+esc(a.dur)+'s</span></td></tr>'});
    b+='</table></div>'+(audios.length?'':'<p class="mu">Chưa có bản ghi âm.</p>')}
  if(tab==='cai-dat')b='<h1>Cài đặt</h1><div class="card"><p>Link học sinh: dùng link web app (không thêm gì).<br>Link giáo viên: thêm <b>?page=giao-vien</b> vào cuối link.</p><button id="lo">Đăng xuất</button></div>';
  shell('G','Giáo viên','Giáo viên',items,b);
  if($('ta'))$('ta').onclick=async function(){var t=$('tt').value.trim(),qs=$('tq').value.split('\n').map(function(l){var p=l.split('|');return{q:p[0].trim(),a:(p[1]||'').trim()}}).filter(function(x){return x.q});
    var ln=+$('tl').value;if(!t)t='Bài '+ln+': '+LS[ln-1][1];if(!qs.length){note='Cần ít nhất một câu hỏi.';render();return}
    try{await call('add',{pw:pw,title:t,qs:qs,lesson:ln});note='';var r=await call('tdata',{pw:pw});assigns=r.as;subs=r.subs;render()}catch(e){note='Lỗi khi đăng bài.';render()}};
  app.querySelectorAll('[data-del]').forEach(function(x){x.onclick=async function(){
    if(!x.dataset.s){x.dataset.s=1;x.textContent='Bấm lần nữa để xóa';return}
    try{await call('del',{pw:pw,id:x.dataset.del});var r=await call('tdata',{pw:pw});assigns=r.as;subs=r.subs;render()}catch(e){}}});
  app.querySelectorAll('[data-v]').forEach(function(x){x.onclick=function(){var v=$('vw');v.hidden=false;v.innerHTML=detail(E[+x.dataset.v])}});
  app.querySelectorAll('[data-a]').forEach(function(x){x.onclick=async function(){x.textContent='Đang tải…';
    try{var r=await call('getAudio',{pw:pw,id:x.dataset.a}),bin=atob(r.data),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
      aud[x.dataset.a]=URL.createObjectURL(new Blob([u],{type:r.mime||'audio/webm'}));render()}catch(e){x.textContent='Lỗi, bấm lại'}}});
  if($('lo'))$('lo').onclick=function(){pw='';render()};
}

/* ===== HỌC SINH ===== */
function sLogin(){
  var o={};try{o=JSON.parse(sget('me')||'{}')||{}}catch(e){}
  app.innerHTML='<div class="lg"><div class="av">小</div><h3 style="margin:4px 0 10px">Thông tin học sinh</h3><label>Họ và tên</label><input id="sn" value="'+esc(o.name||'')+'"><label>Lớp</label><input id="sc" value="'+esc(o.cls||'')+'"><button class="bt" id="sl">Bắt đầu làm bài</button><p class="no">'+esc(note)+'</p></div>';
  $('sl').onclick=function(){var n=$('sn').value.trim(),c=$('sc').value.trim();
    if(!n||!c){note='Vui lòng nhập họ tên và lớp.';render();return}
    me={name:n,cls:c};sset('me',JSON.stringify(me));tab='tong-quan';loadS()};
}
async function loadS(){
  note='Đang tải…';render();
  try{var r=await Promise.all([call('list'),call('mine',me)]);assigns=r[0];work=r[1];note=''}catch(e){note=errMsg(e)}
  render();
}
function student(){
  var nd=assigns.filter(function(a){return W(a.id)}).length,b='';
  var items=[{k:'tong-quan',i:'▦',l:'Tổng quan'},{g:'Học tập'},{k:'bai-tap',i:'✎',l:'Bài tập'},{g:'Tiến độ'},{k:'nhat-ky',i:'📓',l:'Nhật ký học tập'}];
  if(tab==='tong-quan')b='<h1>Xin chào, '+esc(me.name)+'</h1><div class="g3"><div class="card"><div class="big">'+nd+'/'+assigns.length+'</div>Bài đã nộp</div><div class="card"><div class="big">'+(assigns.length-nd)+'</div>Bài chưa làm</div></div>';
  if(tab==='bai-tap'){var a=cur&&A(cur);
    if(a){var d=W(cur);b='<h1>'+esc(a.title)+'</h1><div class="card">';
      a.qs.forEach(function(q,i){b+='<label><b>'+(i+1)+'. '+esc(q.q)+'</b></label><input class="qa" data-i="'+i+'" value="'+esc(d?d.ans[i]:'')+'" '+(d?'disabled':'')+'>'});
      b+=(d?'<p>Đã nộp. Điểm: <b>'+(d.score==null?'chờ giáo viên chấm':esc(d.score))+'</b></p>':'<button id="sb">Nộp bài</button>')+'<button class="g" id="bk">Quay lại</button></div>';
    }else if(curL){var ls=assigns.filter(function(x){return x.lesson===curL});
      b='<h1>Bài '+curL+': '+esc(LS[curL-1][0])+'</h1>'+practice(curL)+'<div class="card">';
      if(!ls.length&&!PRAC[curL])b+='<p class="mu">Giáo viên chưa đăng bài tập cho bài này.</p>';
      ls.forEach(function(x){var d=W(x.id);b+='<div class="row"><span>'+esc(x.title)+' <span class="mu">'+(d?'· đã nộp'+(d.score!=null?' · '+esc(d.score):''):'')+'</span></span><button data-o="'+x.id+'">'+(d?'Xem':'Làm bài')+'</button></div>'});
      b+='<button class="g" id="bl">Quay lại</button></div>';
    }else{b='<h1>Bài tập</h1><div class="lc">';
      LS.forEach(function(l,i){var n=i+1,ls=assigns.filter(function(x){return x.lesson===n}),dn=ls.filter(function(x){return W(x.id)}).length;
        b+='<div class="lk" data-l="'+n+'"><div class="ln">Bài '+n+(ls.length?' · '+dn+'/'+ls.length+(dn===ls.length?' ✓':''):'')+'</div><div class="lz">'+esc(l[0])+'</div><div class="lv">'+esc(l[1])+'</div></div>'});
      b+='</div>'}}
  if(tab==='nhat-ky'){b='<h1>Nhật ký học tập</h1><div class="card w"><table><tr><th>Thời gian</th><th>Bài</th><th>Điểm</th></tr>';
    work.slice().sort(function(x,y){return y.at-x.at}).forEach(function(w){var a=A(w.aid);if(a)b+='<tr><td>'+fd(w.at)+'</td><td>'+esc(a.title)+'</td><td>'+(w.score==null?'—':esc(w.score))+'</td></tr>'});b+='</table></div>'}
  if(tab==='cai-dat')b='<h1>Cài đặt</h1><div class="card"><p>Họ tên: <b>'+esc(me.name)+'</b> · Lớp: <b>'+esc(me.cls)+'</b></p><button id="ch">Đổi họ tên / lớp</button></div>';
  shell((me.name||'?').trim().slice(0,1).toUpperCase(),me.name,'Lớp '+me.cls,items,b);
  app.querySelectorAll('[data-o]').forEach(function(x){x.onclick=function(){cur=x.dataset.o;render()}});
  app.querySelectorAll('[data-l]').forEach(function(x){x.onclick=function(){var n=+x.dataset.l,ls=assigns.filter(function(a){return a.lesson===n});if(ls.length===1&&!PRAC[n])cur=ls[0].id;else{curL=n;px=0}render()}});
  if($('bl'))$('bl').onclick=function(){stopRec();curL=null;render()};
  app.querySelectorAll('[data-x]').forEach(function(x){x.onclick=function(){if(recOn)return;px=+x.dataset.x;note='';render()}});
  if($('rr'))$('rr').onclick=function(){recStart(curL,px)};
  if($('rs'))$('rs').onclick=stopRec;
  if($('rt2'))$('rt2').onclick=function(){var r=recs[$('rt2').dataset.k];r.st='Đang gửi lại…';r.fail=false;render();upload($('rt2').dataset.k)};
  if($('bk'))$('bk').onclick=function(){cur=null;render()};
  if($('ch'))$('ch').onclick=function(){me=null;work=[];render()};
  if($('sb'))$('sb').onclick=async function(){
    var ans=[];app.querySelectorAll('.qa').forEach(function(i){ans[+i.dataset.i]=i.value});
    $('sb').disabled=true;
    try{var r=await call('submit',{name:me.name,cls:me.cls,aid:cur,ans:ans});
      if(r.err){note=r.err;$('sb').disabled=false;render();return}
      if(!W(cur))work.push(r.rec);note='';render()}
    catch(e){note='Nộp bài chưa được, thử lại.';render()}};
}
render();if(!isT){var m=null;try{m=JSON.parse(sget('me')||'null')}catch(e){}if(m){me=m;loadS()}}
</script>
